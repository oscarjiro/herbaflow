# Local pre-commit gate. Install once: `pip install pre-commit && pre-commit install`.
# Lint-only for now; ruff-format adoption is a separate pass (tree not yet formatted).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]

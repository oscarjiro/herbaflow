[project]
name = "herbaflow-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "rdkit>=2024.3",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "black>=24.10",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "testcontainers[postgresql]>=4.8",
    "psycopg2-binary>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008"]  # FastAPI uses Depends() in default args — this is intentional
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts allowed in tests

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# `typings/` shadows the rdkit wheel's bundled `rdkit-stubs`, whose generated .pyi files
# have syntax errors that crash mypy at parse time. See typings/rdkit/__init__.pyi.
mypy_path = "typings"

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

project:
    name: indonesian-medicinal-plants-etl
    domain: network_pharmacology
    source_corpus: knapsack_indonesia
    description: >
        ETL pipeline for Indonesian medicinal plants scraped from KNApSAcK,
        normalized through GBIF, and exported as canonical seed tables for Supabase.

paths:
    root: .

    steps:
        extract:
            script: ./01_extract/extract_plants.py
            input: ../knapsack/out/plants.csv
            output_dir: ./01_extract/out
            output_file: stg_plants.csv
            log_file: extract_plants.log
            source_batch_id: "knapsack_world_id_2026_04_17"

        normalize_taxonomy:
            script: ./02_normalize_taxonomy/normalize_taxonomy.py
            input: ./01_extract/out/stg_plants.csv
            output_dir: ./02_normalize_taxonomy/out
            output_file: normalized_plants.csv
            report_file: normalize_taxonomy_report.txt
            log_file: normalize_taxonomy.log

        match_gbif:
            script: ./03_match_gbif/match_gbif.py
            input: ./02_normalize_taxonomy/out/normalized_plants.csv
            output_dir: ./03_match_gbif/out
            cache_dir: ./03_match_gbif/out/cache
            output_file: gbif_matches.csv
            log_file: match_gbif.log

        build_canonical_part1:
            script: ./04_build_canonical/build_canonical_part1.py
            input: ./03_match_gbif/out/gbif_matches.csv
            output_dir: ./04_build_canonical/out
            accepted_file: accepted_plants.csv
            review_file: review_plants.csv
            rejected_file: rejected_plants.csv
            manually_accepted_review_file: manually_accepted_review_plants.csv
            report_file: build_canonical_report.txt
            log_file: build_canonical.log

        build_canonical_part2:
            script: ./04_build_canonical/build_canonical_part2.py
            input: ./04_build_canonical/out/accepted_plants.csv
            manually_accepted_review_input: ./04_build_canonical/out/manually_accepted_review_plants.csv
            output_dir: ./04_build_canonical/out
            plants_file: plants.csv
            aliases_file: plant_aliases.csv
            report_file: build_canonical_part2_report.txt
            log_file: build_canonical_part2.log

        validate:
            script: ./05_validate/validate.py
            plants: ./04_build_canonical/out/plants.csv
            aliases: ./04_build_canonical/out/plant_aliases.csv
            output_dir: ./05_validate/out
            report_csv: validation_report.csv
            report_json: validation_report.json
            validated_plants: plants.csv
            validated_aliases: plant_aliases.csv
            log_file: validate.log

        export:
            script: ./06_export/export.py
            input_dir: ./05_validate/out
            output_dir: ./06_export/out
            plants_file: plants.csv
            aliases_file: plant_aliases.csv
            manifest_file: export_manifest.json
            log_file: export.log

source:
    name: KNApSAcK World
    type: scrape
    base_url: https://www.knapsackfamily.com
    corpus_filter: indonesia
    source_version: scraped_snapshot

gbif:
    enabled: true
    base_url: https://api.gbif.org/v2
    match_endpoint: /species/match
    user_agent: indonesian-medicinal-plants-etl/1.0
    cache_responses: true
    cache_ttl_days: 3650
    accept_rules:
        exact_match_types:
            - EXACT
        accept_min_confidence: 95
        review_min_confidence: 70
        reject_below_confidence: 70

taxonomy:
    canonical_name_mode: accepted_name_without_authorship
    keep_authorship_separate: true
    normalization:
        trim_whitespace: true
        collapse_internal_spaces: true
        normalize_unicode: true

identifiers:
    plant_id_prefix: pl_
    alias_id_prefix: al_
    canonical_key_format: gbif:{gbif_usage_key}
    use_string_ids: true

validation:
    fail_on:
        - duplicate_canonical_key
        - orphan_alias
        - missing_required_columns
        - empty_canonical_scientific_name
        - empty_source_name
        - empty_source_url
        - empty_retrieved_at
        - empty_source_batch_id

    warn_on:
        - missing_family_name
        - suspicious_authorship_in_canonical_name
        - float_like_gbif_ids

export:
    format: csv
    include_sql: false
    overwrite_existing: true
    encoding: utf-8

logging:
    level: INFO
    format: "%(asctime)s | %(levelname)s | %(message)s"

runtime:
    dry_run_default: false
    stop_on_error: true
